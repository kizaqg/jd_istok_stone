name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tests
        run: dotnet test tests/JdStones.Core.Tests -c Release
      - name: Publish exe
        run: dotnet publish src/JdStones -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: JdStones
          path: publish/JdStones.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/JdStones.exe
