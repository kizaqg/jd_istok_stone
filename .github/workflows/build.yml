name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tests
        run: dotnet test tests/JdStones.Core.Tests -c Release
      - name: Publish exe
        run: dotnet publish src/JdStones -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: JdStones
          path: publish/JdStones.exe
      # Готовый exe публикуется в Releases — скачивается одной ссылкой, без входа в GitHub.
      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Камни истока (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Скачайте **JdStones.exe** ниже (раздел Assets) и запустите. Ничего устанавливать не нужно.
            Инструкция — в README.md.
          files: publish/JdStones.exe
